services:
  demo:
    image: sage-icpp-demo:20260926-cpu-full
    pull_policy: never
    init: true
    entrypoint: ${SAGE_ENTRYPOINT:-/opt/demo-tools/start-providers.sh}
    ports:
    - "127.0.0.1:${LOCAL_DEMO_PORT:-18400}:18400"
    extra_hosts:
    - "host.docker.internal:${SAGE_HOST_GATEWAY:-host-gateway}"
    environment:
      SAGE_LLM_BASE_URL: "${SAGE_LLM_BASE_URL:-}"
      SAGE_LLM_MODEL: "${SAGE_LLM_MODEL:-}"
      SAGE_OPENAI_API_KEY: "${SAGE_OPENAI_API_KEY:-EMPTY}"
      SAGE_RERANKER_BASE_URL: "${SAGE_RERANKER_BASE_URL:-}"
      SAGE_RERANKER_MODEL: "${SAGE_RERANKER_MODEL:-}"
      SAGE_EMBEDDING_BASE_URL: "${SAGE_EMBEDDING_BASE_URL:-}"
      SAGE_EMBEDDING_MODEL: ${SAGE_EMBEDDING_MODEL:-}
      SAGE_EMBEDDING_API_KEY: ${SAGE_EMBEDDING_API_KEY:-}
      SAGE_EMBEDDING_PROVIDER: ${SAGE_EMBEDDING_PROVIDER:-openai}
      SAGE_RERANKER_API_KEY: ${SAGE_RERANKER_API_KEY:-}
      SAGE_RERANKER_PROVIDER: ${SAGE_RERANKER_PROVIDER:-openai}
      SAGE_MODEL_TIMEOUT: ${SAGE_MODEL_TIMEOUT:-90}
    volumes:
    - local-data:/data
    - ./scripts:/opt/demo-tools:ro
    restart: unless-stopped
volumes:
  local-data:
